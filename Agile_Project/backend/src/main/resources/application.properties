spring.application.name=smart-lms
server.port=8080

# --- Database Configuration (MySQL ORM default) ---
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Session Management ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# --- LMS Rules & Backlog Config ---
lms.auth.allowed-domain=vitapstudent.ac.in,vitap.ac.in
lms.otp.expiry-minutes=5
lms.borrow.default-days=14
lms.borrow.max-active-loans=3
lms.borrow.max-renewals=2
lms.fine.per-day=5.0
lms.upload.dir=./uploads/papers

# --- Multipart File Upload Limits ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
